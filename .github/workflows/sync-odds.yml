name: Sync Odds

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # manual trigger for testing

permissions:
  contents: read
  actions: write   # dispatches deploy-app.yml at the end

jobs:
  sync-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Sync odds
        id: sync
        run: npm run sync-odds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Rebuild only when the sync stored new snapshots (scripts/sync-odds.ts
      # writes `inserted`; a provider outage writes nothing). Spec §5 / §5b.
      - name: Rebuild site (dispatch deploy-app)
        if: ${{ success() && steps.sync.outputs.inserted != '' && steps.sync.outputs.inserted != '0' }}
        run: gh workflow run deploy-app.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
