name: Post-Game Pipeline

on:
  schedule:
    - cron: '0 10 * * *'   # nightly at 10:00 UTC (3am PDT / 2am PST)
  workflow_dispatch:
    inputs:
      pbp_days:
        description: 'Play-by-play lookback in days (default 3; raise it to backfill games the nightly run missed)'
        required: false
        default: '3'
      postgame_days:
        description: 'Postgame insight window in days (default 3; raise it once to backfill game pages)'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  post-game:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Refresh the schedule first so last night's games exist and carry the
      # official NBA game id that finalization needs for cdn.nba.com.
      - name: Sync schedule (balldontlie)
        run: npm run sync-schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

      - name: Attach NBA game ids (NBA CDN schedule)
        run: npm run backfill-schedule-nba
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Every NBA game from the last few days, not just the Clippers' — league
      # ranks, opponent context and percentile insights need the whole league.
      - name: Sync league games (last 3 days)
        run: npm run sync-league-games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Clippers catch-all (older misses); usually finds nothing after the sync.
      - name: Finalize games
        run: npm run finalize-games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Compute stats
        run: npm run compute-stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Clippers play-by-play → game flow / period / clutch tables (last 3 days,
      # or the manual run's pbp_days). Games already ingested are skipped.
      # continue-on-error: an ESPN outage must not block the box-score insights;
      # those games just get no play-by-play frames tonight.
      - name: Ingest play-by-play
        continue-on-error: true
        run: |
          [[ "$PBP_DAYS" =~ ^[0-9]{1,3}$ ]] || { echo "Invalid pbp_days: $PBP_DAYS"; exit 1; }
          npm run ingest-pbp -- --days="$PBP_DAYS"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PBP_DAYS: ${{ inputs.pbp_days || '3' }}

      # Game highs, streaks and records start: the insight framer reads them.
      - name: Build record book
        run: npm run build-record-book
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Every batch surface: season, pregame (next game), postgame (finals in the
      # last postgame_days days) and player. Stale claims are deactivated per
      # detector and, for postgame, per game.
      - name: Generate insights
        run: |
          [[ "$POSTGAME_DAYS" =~ ^[0-9]{1,3}$ ]] || { echo "Invalid postgame_days: $POSTGAME_DAYS"; exit 1; }
          npm run generate-insights -- --days="$POSTGAME_DAYS"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGAME_DAYS: ${{ inputs.postgame_days || '3' }}

      # id: verify — later steps still run after a proof failure (see their `if`),
      # but not after an upstream sync failure.
      - name: Verify insight proofs
        id: verify
        run: npm run verify-insights
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGAME_DAYS: ${{ inputs.postgame_days || '3' }}

      # Current roster (ESPN) → /api/players default. An ESPN outage keeps the
      # previous snapshot, so it doesn't fail the pipeline.
      - name: Sync current roster
        if: ${{ success() || (failure() && steps.verify.outcome == 'failure') }}
        continue-on-error: true
        run: node node_modules/.bin/tsx scripts/sync-roster.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Line scores for Clippers games finalized before they were stored
      # (bounded per night; a no-op once the backlog is done).
      - name: Backfill line scores
        id: line_scores
        if: ${{ success() || (failure() && steps.verify.outcome == 'failure') }}
        run: node node_modules/.bin/tsx scripts/backfill-periods.ts --limit 150
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Read by /api/home as meta.last_sync_at.
      - name: Record last sync time
        if: ${{ success() || (failure() && steps.verify.outcome == 'failure' && steps.line_scores.outcome != 'failure') }}
        run: node node_modules/.bin/tsx scripts/record-sync.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Refit the live win-probability model with last night's games (Live v2
      # spec §7.1). Exits 1 — a red run — if the fit got worse by more than
      # 0.005 Brier; the stored model is kept. Storing the fit writes
      # production app_kv, so it's a dry run (fit, print, check) until the
      # repository variable WP_CALIBRATE_WRITE is set to 'true'.
      - name: Calibrate win probability
        if: ${{ success() || (failure() && steps.verify.outcome == 'failure') }}
        run: |
          if [ "$WP_CALIBRATE_WRITE" = "true" ]; then
            npm run calibrate-wp
          else
            echo "WP_CALIBRATE_WRITE is not 'true': dry run, the fit is not stored."
            npm run calibrate-wp -- --dry
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WP_CALIBRATE_WRITE: ${{ vars.WP_CALIBRATE_WRITE }}
