name: Post-Game Pipeline

on:
  schedule:
    - cron: '0 10 * * *'   # nightly at 10:00 UTC (3am PDT / 2am PST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-game:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Refresh the schedule first so last night's games exist and carry the
      # official NBA game id that finalization needs for cdn.nba.com.
      - name: Sync schedule (balldontlie)
        run: npm run sync-schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

      - name: Attach NBA game ids (NBA CDN schedule)
        run: npm run backfill-schedule-nba
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Every NBA game from the last few days, not just the Clippers' — league
      # ranks, opponent context and percentile insights need the whole league.
      - name: Sync league games (last 3 days)
        run: npm run sync-league-games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Clippers catch-all (older misses); usually finds nothing after the sync.
      - name: Finalize games
        run: npm run finalize-games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Compute stats
        run: npm run compute-stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Clippers play-by-play → game flow / period / clutch tables (last 3 days).
      # continue-on-error: Plan 2's insights will depend on this and the record
      # book; until then a failure here must not block the insights steps.
      - name: Ingest play-by-play
        continue-on-error: true
        run: npm run ingest-pbp
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Game highs, streaks and records start for insight framing.
      # continue-on-error until Plan 2 depends on it (see Ingest play-by-play).
      - name: Build record book
        continue-on-error: true
        run: npm run build-record-book
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate insights
        run: npm run generate-insights
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify insight proofs
        run: npm run verify-insights
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Refit the live win-probability model with last night's games (Live v2
      # spec §7.1). Exits 1 — a red run — if the fit got worse by more than
      # 0.005 Brier; the stored model is kept.
      - name: Calibrate win probability
        run: npm run calibrate-wp
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Current roster (ESPN) → /api/players default. An ESPN outage keeps the
      # previous snapshot, so it doesn't fail the pipeline.
      - name: Sync current roster
        continue-on-error: true
        run: node node_modules/.bin/tsx scripts/sync-roster.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Line scores for Clippers games finalized before they were stored
      # (bounded per night; a no-op once the backlog is done).
      - name: Backfill line scores
        run: node node_modules/.bin/tsx scripts/backfill-periods.ts --limit 150
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Read by /api/home as meta.last_sync_at.
      - name: Record last sync time
        run: node node_modules/.bin/tsx scripts/record-sync.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
