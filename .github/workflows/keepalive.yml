name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity (they were all found in state disabled_inactivity). Re-enabling
# them through the API resets that timer, so this runs monthly and enables
# every workflow in the repo, itself included.

on:
  schedule:
    - cron: '0 12 1 * *'   # 12:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in keepalive.yml poll-live.yml post-game.yml sync-odds.yml sync-schedule.yml; do
            gh api -X PUT "repos/${REPO}/actions/workflows/${wf}/enable"
            echo "enabled ${wf}"
          done
