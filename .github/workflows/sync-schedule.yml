name: Sync Schedule

on:
  schedule:
    - cron: '0 14 * * *'   # daily at 14:00 UTC (7am PDT / 6am PST)
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # dispatches deploy-app.yml at the end

jobs:
  sync-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run sync-schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

      - name: Attach NBA game ids (NBA CDN schedule)
        run: npm run backfill-schedule-nba
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Only after both sync steps succeeded (default `if: success()`).
      - name: Rebuild site (dispatch deploy-app)
        run: gh workflow run deploy-app.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
